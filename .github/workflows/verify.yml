name: Verify Tatari website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/tatari-admin-center]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
